# Round 3 (A): native-format rows, hint-free, same LoRA hparams as t1/c1 except lr and iters. 320 microbatches (batch 1 x accum 4 = 80 updates).
# Base: Thesis/sft/models/gemma-4-e2b-it-mlx. Data sft/data/distill/r3/mlx-A. No resume. Adapter is applied at RUNTIME on the bartowski GGUF.
fine_tune_type: lora
seed: 61
num_layers: 16
batch_size: 1
iters: 320
val_batches: -1
learning_rate: 2.0e-5
steps_per_report: 10
steps_per_eval: 1000
save_every: 100
max_seq_length: 9500
mask_prompt: true
grad_checkpoint: true
grad_accumulation_steps: 4
adapter_path: sft/adapters-r3-think-A

lora_parameters:
  rank: 8
  scale: 2.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
