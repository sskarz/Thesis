# Round 5 A2 arm S0: clean AB-think rows (two flagged tasks removed), hparams identical to think_AB (lr 2e-5, rank 8, scale 2, q-only effective, 320 microbatches = 80 updates, seed 61, max_seq 9500). Loss: stock mlx_lm loss.
# Base: Thesis/sft/models/gemma-4-e2b-it-mlx. Data sft/data/distill/r5/mlx-AB-think-clean. Adapter applied at RUNTIME on the bartowski GGUF.
fine_tune_type: lora
seed: 61
num_layers: 16
batch_size: 1
iters: 320
val_batches: -1
learning_rate: 2.0e-5
steps_per_report: 10
steps_per_eval: 1000
save_every: 100
max_seq_length: 9500
mask_prompt: true
grad_checkpoint: true
grad_accumulation_steps: 4
adapter_path: sft/adapters-r5-S0

lora_parameters:
  rank: 8
  scale: 2.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
