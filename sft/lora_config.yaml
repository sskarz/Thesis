# mlx-lm LoRA config for Gemma-4-E2B IFFC SFT v1 (Apple Silicon).
# Rank 16 is the default; 32 is in-band if memory allows.
# Rank / alpha follow ToolACE-8B (r=16, alpha=32) — see METHODS.md §13 / §18.
#
# Usage:
#   python -m mlx_lm.lora --model <mlx-or-hf> --train --data sft/data/mlx \
#     --config sft/lora_config.yaml --mask-prompt --iters 100
#
# Keys may need adjusting if Gemma 4 rejects q_proj/v_proj names; dropping
# `keys` lets mlx-lm attach adapters to the layers it knows about.

fine_tune_type: lora
seed: 42
num_layers: 16
batch_size: 1
iters: 2000
val_batches: 25
learning_rate: 1.0e-5
steps_per_report: 10
steps_per_eval: 200
save_every: 100
max_seq_length: 4096
mask_prompt: true
grad_checkpoint: true
grad_accumulation_steps: 4
adapter_path: sft/adapters

lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
