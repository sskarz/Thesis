[project]
name = "thesis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "bfcl-eval>=2025.8.6.2",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "aiohttp>=3.11.0",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "tqdm>=4.67.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/vfs-shell/tests"]
pythonpath = ["experiments/vfs-shell"]
markers = [
    "live: requires a running local llama-server and explicit opt-in",
    "slow: longer-running artifact or pipeline coverage",
]
